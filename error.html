<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Error de Conexión - Caldero Sur WiFi</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="card">
        <div class="header">
            <img src="Caldero-Sur-Wifi.png" alt="Logo Pasapalos" class="logo">
        </div>

        <div class="content">
            <span class="status-badge offline">● Error del Sistema</span>
            <p class="login-label">Ocurrió un problema</p>

            <div class="error-container">
                <p id="error-msg-text" class="error-text">$(error)</p>
            </div>

            <p class="message-box">No se pudo completar la solicitud. Por favor intenta volver a la página principal del portal.</p>

            <a href="$(link-login)" class="btn-login">VOLVER AL INICIO</a>
        </div>
    </div>

    <script type="text/javascript">
        var error = "$(error)";
        var errorDiv = document.getElementById("error-msg-text");
        if (errorDiv) {
            if (error.indexOf("invalid user or password") !== -1) { 
                errorDiv.innerHTML = "Usuario o contraseña incorrectos."; 
            } else if (error.indexOf("stored counters reached") !== -1) { 
                errorDiv.innerHTML = "Se ha agotado su tiempo o saldo."; 
            } else if (error.indexOf("no more sessions are allowed") !== -1) { 
                errorDiv.innerHTML = "Ya tienes una sesión activa."; 
            }
        }
    </script>
</body>
</html>
